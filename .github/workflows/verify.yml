name: Verify upload

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json

      - uses: aws-actions/setup-sam@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CloudFormation linter
        run: pip install cfn-lint

      - name: Install backend dependencies
        run: npm ci --prefix src

      - name: Run unit tests
        run: npm test --prefix src

      - name: Check JavaScript syntax
        run: |
          find src frontend/static/misionemprende/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate SAM infrastructure
        run: sam validate --lint --template-file template.yaml

      - name: Validate FIS experiment template
        run: cfn-lint fis/finish-phase-experiments.yaml
