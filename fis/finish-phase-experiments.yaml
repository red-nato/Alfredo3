AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Experimentos AWS Fault Injection Service para comprobar que FinishPhase
  tolera latencia y errores transitorios. Desplegar solo en una cuenta/stage de pruebas.

Parameters:
  FinishPhaseFunctionArn:
    Type: String
    Description: ARN de la Lambda FinishPhase (no un alias) del ambiente de pruebas.
  FisExperimentRoleArn:
    Type: String
    Description: ARN de un rol existente asumible por fis.amazonaws.com.
  StopAlarmArn:
    Type: String
    Description: ARN de una alarma CloudWatch que detiene el experimento al detectar degradación.

Resources:
  FinishPhaseLatencyExperiment:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: Añade 3 segundos al 25% de invocaciones de FinishPhase durante dos minutos.
      RoleArn: !Ref FisExperimentRoleArn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !Ref StopAlarmArn
      Targets:
        FinishPhase:
          ResourceType: aws:lambda:function
          ResourceArns: [!Ref FinishPhaseFunctionArn]
          SelectionMode: COUNT(1)
      Actions:
        AddInvocationDelay:
          ActionId: aws:lambda:invocation-add-delay
          Parameters:
            duration: PT2M
            invocationPercentage: '25'
            startupDelayMilliseconds: '3000'
          Targets:
            Functions: FinishPhase
      Tags:
        Application: MisionEmprende
        Experiment: finish-phase-latency

  FinishPhaseErrorExperiment:
    Type: AWS::FIS::ExperimentTemplate
    Properties:
      Description: Devuelve errores controlados en el 10% de FinishPhase durante un minuto.
      RoleArn: !Ref FisExperimentRoleArn
      StopConditions:
        - Source: aws:cloudwatch:alarm
          Value: !Ref StopAlarmArn
      Targets:
        FinishPhase:
          ResourceType: aws:lambda:function
          ResourceArns: [!Ref FinishPhaseFunctionArn]
          SelectionMode: COUNT(1)
      Actions:
        InjectInvocationError:
          ActionId: aws:lambda:invocation-error
          Parameters:
            duration: PT1M
            invocationPercentage: '10'
            preventExecution: 'true'
          Targets:
            Functions: FinishPhase
      Tags:
        Application: MisionEmprende
        Experiment: finish-phase-errors

Outputs:
  FinishPhaseLatencyExperimentId:
    Value: !Ref FinishPhaseLatencyExperiment
  FinishPhaseErrorExperimentId:
    Value: !Ref FinishPhaseErrorExperiment
