<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shlam - Mapa de Fases</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body { 
  font-family: 'Press Start 2P', monospace; 
  background: #E2F0CB; /* Verde pastel muy suave */
  color: #000;
  overflow-x: hidden;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px;
  transition: background 0.5s ease;
}

/* Patrón de cuadrícula tenue para el fondo */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: linear-gradient(rgba(0,0,0,0.03) 2px, transparent 2px),
                    linear-gradient(90deg, rgba(0,0,0,0.03) 2px, transparent 2px);
  background-size: 30px 30px;
  z-index: -1;
  pointer-events: none;
}

.header {
  width: 100%;
  max-width: 800px;
  background: #FFF;
  border: 6px solid #000;
  padding: 16px;
  text-align: center;
  box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
  margin-bottom: 30px;
}
.header h1 { font-size: clamp(14px, 3vw, 24px); line-height: 1.5; text-shadow: 2px 2px 0 #FFDAC1; }

/* Contenedor del Mapa */
.map-container {
  position: relative;
  width: 100%;
  max-width: 800px;
  height: 400px;
  background: #B5EAD7; /* Menta pastel */
  border: 6px solid #000;
  box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
  margin-bottom: 30px;
  border-radius: 8px;
  overflow: hidden;
}

/* Caminos (Líneas punteadas) */
.path {
  position: absolute;
  background: transparent;
  z-index: 1;
}
.path-1 { top: 70%; left: 15%; width: 30%; height: 6px; border-bottom: 6px dashed #000; transform: rotate(-25deg); transform-origin: left; }
.path-2 { top: 40%; left: 42%; width: 30%; height: 6px; border-bottom: 6px dashed #000; transform: rotate(15deg); transform-origin: left; }
.path-3 { top: 50%; left: 70%; width: 25%; height: 6px; border-bottom: 6px dashed #000; transform: rotate(-40deg); transform-origin: left; }

/* Nodos del Mapa (Fases) */
.node {
  position: absolute;
  width: 60px;
  height: 60px;
  background: #FFF;
  border: 5px solid #000;
  box-shadow: 4px 4px 0 #000;
  z-index: 2;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  transition: transform 0.1s;
}
.node:hover { transform: scale(1.1) translateY(-4px); }
.node.active { animation: bounce 0.6s infinite alternate; box-shadow: 0 0 0 4px #FFF, 0 0 0 8px #000; }

@keyframes bounce {
  0% { transform: translateY(0); }
  100% { transform: translateY(-10px); }
}

/* Posiciones de los Nodos */
.node-1 { top: 60%; left: 10%; background: #FFB7B2; } /* Rosa pastel */
.node-2 { top: 30%; left: 38%; background: #FFDAC1; } /* Naranja pastel */
.node-3 { top: 40%; left: 68%; background: #E2F0CB; } /* Amarillo/Verde pastel */
.node-4 { top: 15%; left: 85%; background: #C7CEEA; } /* Lila pastel */

.node-label {
  position: absolute;
  bottom: -25px;
  left: 50%;
  transform: translateX(-50%);
  background: #000;
  color: #FFF;
  padding: 4px 8px;
  font-size: 8px;
  white-space: nowrap;
}

/* Panel de Detalles de la Fase */
.details-panel {
  width: 100%;
  max-width: 800px;
  background: #FFF;
  border: 6px solid #000;
  box-shadow: 8px 8px 0 rgba(0,0,0,0.2);
  padding: 24px;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.details-header {
  display: flex;
  align-items: center;
  gap: 16px;
  border-bottom: 4px dashed #ccc;
  padding-bottom: 16px;
}

.phase-icon {
  width: 80px;
  height: 80px;
  border: 4px solid #000;
  box-shadow: 4px 4px 0 #000;
  background: #FFB7B2;
}

.phase-title { font-size: 16px; line-height: 1.4; }
.phase-desc { font-size: 10px; line-height: 1.8; color: #333; }

.info-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-top: 10px;
}

.info-box {
  background: #f4f4f4;
  border: 4px solid #000;
  padding: 12px;
}
.info-box h3 { font-size: 10px; margin-bottom: 8px; color: #000; }
.info-box ul { list-style: none; padding: 0; }
.info-box li { font-size: 8px; margin-bottom: 6px; line-height: 1.4; }
.info-box li::before { content: '>'; margin-right: 8px; color: #FF4B4B; }

/* Botón entrar fase */
.btn-enter {
  background: #FFDAC1;
  border: 5px solid #000;
  color: #000;
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  padding: 16px;
  cursor: pointer;
  box-shadow: 4px 4px 0 #000;
  text-align: center;
  margin-top: 10px;
  transition: all 0.1s;
}
.btn-enter:active { transform: translate(4px, 4px); box-shadow: 0 0 0 #000; }

@media (max-width: 600px) {
  .info-grid { grid-template-columns: 1fr; }
  .node { width: 45px; height: 45px; font-size: 14px; }
}
</style>
</head>
<body>

  <div class="header">
    <h1>SHLAM // SELECCIÓN DE ZONA</h1>
  </div>

  <div class="map-container" id="map-bg">
    <div class="path path-1"></div>
    <div class="path path-2"></div>
    <div class="path path-3"></div>

    <div class="node node-1 active" onclick="selectPhase(0)" id="n-0">1<div class="node-label">FASE 1</div></div>
    <div class="node node-2" onclick="selectPhase(1)" id="n-1">2<div class="node-label">FASE 2</div></div>
    <div class="node node-3" onclick="selectPhase(2)" id="n-2">3<div class="node-label">FASE 3</div></div>
    <div class="node node-4" onclick="selectPhase(3)" id="n-3">4<div class="node-label">FASE 4</div></div>
  </div>

  <div class="details-panel">
    <div class="details-header">
      <div class="phase-icon" id="d-icon"></div>
      <div>
        <h2 class="phase-title" id="d-title">Cargando...</h2>
      </div>
    </div>
    
    <p class="phase-desc" id="d-desc">Cargando descripción...</p>
    
    <div class="info-grid">
      <div class="info-box">
        <h3>OBJETIVOS</h3>
        <ul id="d-objs"></ul>
      </div>
      <div class="info-box">
        <h3>ENEMIGOS</h3>
        <ul id="d-enem"></ul>
      </div>
    </div>

    <button class="btn-enter">INICIAR FASE &#9658;</button>
  </div>

<script>
// Base de datos de las fases con colores pasteles
const phaseData = [
  {
    id: 0,
    title: "BOSQUE DE PÍXELES",
    desc: "¡Tu viaje comienza aquí! Cruza con cuidado los obstáculos pixelados y recolecta monedas básicas en un bosque colorido lleno de árboles geométricos. Ideal para calentar motores.",
    color: "#FFB7B2", // Rosa pastel
    bg: "#FFE4E1", // Fondo general cuando se selecciona
    objs: ["Recolectar 10 monedas doradas", "Cruzar el río de bloques", "Alcanzar el banderín verde"],
    enem: ["Tronco Rodante", "Pájaro Cuadrado", "Slime Básico"]
  },
  {
    id: 1,
    title: "DESIERTO DE DATOS",
    desc: "Un vasto desierto digital con dunas de código y obstáculos más rápidos. ¡Cuidado con los 'glitches' en el suelo y los enemigos electrónicos que patrullan la zona!",
    color: "#FFDAC1", // Naranja pastel
    bg: "#FFF5E1",
    objs: ["Sobrevivir 2 minutos", "Encontrar el disquete perdido", "Esquivar la tormenta de arena"],
    enem: ["Cactus Eléctrico", "Gusano de Datos", "Glitch Errante"]
  },
  {
    id: 2,
    title: "CIUDAD CRIPTOGRÁFICA",
    desc: "Explora una metrópolis de 8 bits llena de tráfico pesado, trenes a toda velocidad y rompecabezas de lógica. Mide bien tus saltos en esta jungla de asfalto.",
    color: "#E2F0CB", // Verde/Amarillo pastel
    bg: "#F2F9E8",
    objs: ["Cruzar la autopista central", "Hackear 3 terminales", "Llegar a la azotea"],
    enem: ["Coche Autónomo Daltónico", "Dron de Seguridad", "Robot Limpiador"]
  },
  {
    id: 3,
    title: "EL NÚCLEO DEL ERROR",
    desc: "La fase final. Un entorno caótico y cambiante donde te enfrentarás al desafío supremo de Shlam. ¡Todo se mueve más rápido, demuestra tus reflejos!",
    color: "#C7CEEA", // Lila pastel
    bg: "#EAEFFF",
    objs: ["Vencer al Firewall", "Recuperar el código fuente", "Sobrevivir al colapso del nivel"],
    enem: ["Bug Gigante", "Virus Corruptor", "Pantalla Azul de la Muerte"]
  }
];

function selectPhase(index) {
  const data = phaseData[index];

  // Actualizar UI del mapa
  for(let i=0; i<4; i++){
    document.getElementById(`n-${i}`).classList.remove('active');
  }
  document.getElementById(`n-${index}`).classList.add('active');

  // Actualizar colores
  document.body.style.background = data.bg;
  document.getElementById('d-icon').style.background = data.color;
  document.getElementById('map-bg').style.borderColor = data.color;

  // Actualizar textos
  document.getElementById('d-title').innerText = `FASE ${index + 1}: ` + data.title;
  document.getElementById('d-desc').innerText = data.desc;

  // Actualizar listas (Objetivos)
  const objList = document.getElementById('d-objs');
  objList.innerHTML = '';
  data.objs.forEach(obj => {
    let li = document.createElement('li');
    li.innerText = obj;
    objList.appendChild(li);
  });

  // Actualizar listas (Enemigos)
  const enemList = document.getElementById('d-enem');
  enemList.innerHTML = '';
  data.enem.forEach(en => {
    let li = document.createElement('li');
    li.innerText = en;
    enemList.appendChild(li);
  });
}

// Iniciar con la fase 1 seleccionada
window.onload = () => selectPhase(0);

</script>
</body>
</html>
