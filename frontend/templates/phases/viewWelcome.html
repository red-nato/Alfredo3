{% load static %}
<section id="view-welcome" class="active fade-in text-center py-6">
            
            <div class="mb-12 flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-6 text-center md:text-left px-4"> <div class="flex-shrink-0">
                    <img src="{% static 'misionemprende/img/lilfinderguy.png' %}" 
                        alt="Lil Finder Guy" 
                        class="h-40 md:h-64 w-auto block"
                        onclick="app.playSound('nose')">
                </div>

                <div class="flex flex-col w-full max-w-sm md:max-w-none"> <h1 class="text-3xl sm:text-4xl md:text-7xl font-bold text-white mb-2 gamer-font drop-shadow-lg leading-tight">
                        Misión<span class="text-blue-300">Emprende</span>
                    </h1>
                    <p class="text-gray-300 text-xs md:text-xl tracking-widest uppercase">
                        Imagina aprender a emprender mientras juegas.
                    </p>
                </div>
            </div>

            <!-- Texto descriptivo LO ESTOY LOGRANDO CTM-->
            <p class="text-gray-300 text-sm md:text-xl tracking-normal">Un juego para que aprendas habilidades emprendedoras jugando. ¿Las conoces?</p>
            <div class="relative max-w-6xl mx-auto mb-16 mt-4 px-4">
                <div class="flex flex-wrap justify-center gap-4 mb-8">
                    <span class="bg-yellow-500 text-white text-xs font-bold uppercase px-3 py-1 rounded-full shadow-lg">Trabajo en equipo</span>
                    <span class="bg-purple-500 text-white text-xs font-bold uppercase px-3 py-1 rounded-full shadow-lg">Empatía</span>
                    <span class="bg-red-500 text-white text-xs font-bold uppercase px-3 py-1 rounded-full shadow-lg">Creatividad</span>
                    <span class="bg-green-500 text-white text-xs font-bold uppercase px-3 py-1 rounded-full shadow-lg">Comunicación</span>
                </div>
                <div class="hidden md:block absolute top-[52%] left-[10%] right-[10%] h-2 bg-gray-900 rounded-full z-0 border border-gray-700 shadow-[inset_0_0_10px_rgba(0,0,0,0.8)]">
                    <div class="h-full bg-gradient-to-r from-pink-500 via-cyan-500 via-blue-500 to-yellow-500 opacity-80 rounded-full w-full shadow-[0_0_15px_rgba(255,255,255,0.2)]"></div>
                </div>
            </div>
            <!-- botón y secciones inferiores-->
            <button onclick="app.playSound('click'); app.showView('view-login')" class="udd-gradient text-white font-bold text-3xl py-6 px-16 rounded-full shadow-[0_0_30px_rgba(147,51,234,0.6)] hover:shadow-[0_0_50px_rgba(168,85,247,0.8)] transform transition hover:scale-105 active:scale-95 border-4 border-white/10 group mb-16 relative overflow-hidden">
                <div class="absolute inset-0 bg-white/20 transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition duration-500 ease-in-out"></div>
                <span class="flex items-center gap-4 gamer-font relative z-10">
                    <i class="fas fa-play-circle"></i> INICIAR JUEGO
                </span>
            </button>

            <div class="max-w-4xl mx-auto pt-8"> <!-- border-t border-blue-800-->
                <p class="text-white-300 text-sm uppercase tracking-widest mb-4 font-bold">Accesos especiales</p>
                <div class="flex justify-center gap-4">
                    <button onclick="app.showView('view-professor'); app.initProfessorView()" 
                        class="bg-blue-800 hover:bg-blue-700 text-gray-300 hover:text-white px-6 py-3 rounded-lg border border-gray-600 transition flex items-center gap-2">
                        <i class="fas fa-chalkboard-teacher text-yellow-400"></i> Acceso Profesor
                    </button>
                    <button onclick="app.showView('view-admin-login')" class="bg-blue-800 hover:bg-blue-700 text-gray-300 hover:text-white px-6 py-3 rounded-lg border border-gray-600 transition flex items-center gap-2">
                        <i class="fas fa-chart-line text-blue-400"></i> Administrador
                    </button>
                </div>
            </div>
            
            <div class="flex items-center space-x-1 justify-center mt-8">
                <h3 class="text-xl md:text-xl font-bold text-white mb-1 gamer-font drop-shadow-lg">Creado <span class="text-gray-500">por</span></h3>
                <img src="{% static 'misionemprende/img/shlam.png' %}" 
                        alt="Logo ShlamFull" 
                        class="h-24 w-auto opacity-90 hover:opacity-100 transition">
            </div>
        </section>
