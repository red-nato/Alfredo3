{% load static %}

<section id="view-transition" class="hidden fixed inset-0 z-[100] flex bg-slate-900/95 backdrop-blur-md fade-in overflow-hidden">

    <div class="relative w-1/3 md:w-2/5 h-full pointer-events-none flex items-end justify-start overflow-hidden">
        <img src="{% static 'misionemprende/img/Helpis/HelpiAsomado.png' %}" 
             alt="Helpi" 
             class="h-[80vh] md:h-[95vh] object-contain object-left-bottom -ml-16 md:-ml-28 filter drop-shadow-[0_8px_10px_rgba(0,0,0,0.5)]">
    </div>

    <div class="relative flex-1 flex flex-col justify-center items-start px-8 md:px-16 w-full">

        <div id="trans-step-1" class="w-full max-w-2xl transition-all duration-500 transform translate-x-0 opacity-100">
            <p class="text-yellow-400 font-bold tracking-widest uppercase mb-2">Misión Completada</p>
            <h2 id="trans-title" class="text-5xl md:text-6xl font-black text-white gamer-font mb-8 uppercase drop-shadow-[4px_4px_0_rgba(0,0,0,1)]">
                ¡Fase 1!
            </h2>

            <div class="flex flex-col gap-4 mb-10">
                <div id="trans-coins-container" class="inline-flex items-center gap-4 bg-yellow-400 border-4 border-black p-4 shadow-[6px_6px_0_0_rgba(0,0,0,1)] w-max">
                    <div class="w-10 h-10 bg-slate-800 border-2 border-black flex items-center justify-center">
                        <img src="{% static 'misionemprende/img/HelpiCoin.png' %}" class="w-8 h-8 drop-shadow-md" alt="HelpiCoin">
                    </div>
                    <div>
                        <p class="text-black text-xs font-bold uppercase tracking-wide">Recompensa</p>
                        <p id="trans-coins-text" class="text-black text-2xl font-black gamer-font">+0 HelpiCoins</p>
                    </div>
                </div>

                <div class="inline-flex items-center gap-4 bg-cyan-400 border-4 border-black p-4 shadow-[6px_6px_0_0_rgba(0,0,0,1)] w-max mt-2">
                    <div class="w-10 h-10 bg-slate-800 border-2 border-black flex items-center justify-center">
                        <img src="{% static 'misionemprende/img/HelpiCoin.png' %}" class="w-8 h-8 drop-shadow-md" alt="HelpiCoin">
                    </div>
                    <div>
                        <p class="text-black text-xs font-bold uppercase tracking-wide">Total Acumulado</p>
                        <p id="trans-total-coins-text" class="text-black text-2xl font-black gamer-font">0 HelpiCoins</p>
                    </div>
                </div>
            </div>
            <button onclick="app.nextTransitionStep()" 
                    class="bg-green-500 hover:bg-green-400 text-white font-black text-xl px-8 py-4 border-4 border-black shadow-[0_6px_0_0_rgba(0,0,0,1)] hover:shadow-[0_2px_0_0_rgba(0,0,0,1)] hover:translate-y-1 transition-all uppercase gamer-font">
                Siguiente <i class="fas fa-arrow-right ml-2"></i>
            </button>
        </div>

        <div id="trans-step-2" class="absolute top-1/2 -translate-y-1/2 w-full max-w-2xl transition-all duration-500 transform translate-x-10 opacity-0 pointer-events-none">
            
            <p id="trans-next-pre-title" class="text-blue-400 font-bold tracking-widest uppercase mb-2">Siguiente Misión</p>
            
            <h2 id="trans-next-title" class="text-4xl md:text-6xl font-black text-white gamer-font mb-6 uppercase drop-shadow-[4px_4px_0_rgba(0,0,0,1)]">
                Fase N
            </h2>

            <div class="bg-slate-800/80 border-4 border-black p-6 shadow-[6px_6px_0_0_rgba(0,0,0,1)] mb-8 max-w-xl">
                <p id="trans-next-desc" class="text-white text-lg font-medium leading-relaxed">
                    [Texto explicativo]
                </p>
            </div>

            <button id="btn-entendido-transicion" disabled 
                    class="bg-blue-500 text-white font-black text-xl px-8 py-4 border-4 border-black shadow-[0_6px_0_0_rgba(0,0,0,1)] opacity-75 cursor-not-allowed transition-all uppercase gamer-font">
                Avanzando en 10s...
            </button>
        </div>

    </div>
</section>
